name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust:
    # 三个平台都要跑：续跑层几乎全是 `#[cfg(target_os = ...)]`，只在 ubuntu 上
    # 跑 clippy 的话，Windows 和 macOS 分支等于从来没被编译过——上一版就是这么
    # 让一个 Windows 专属的编译错误躺到打标签才暴露的。
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # --all-targets 才会把 #[cfg(test)] 里的代码也编进来：单元测试是跨平台
      # 脚本唯一的自动化保障，不能只编不看。
      # （这里刻意不写测试条数——写了就得跟着改，改漏了这行注释就在说谎。）
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # 0xc0000139 发生在 Rust harness 启动前，`--no-capture` 看不到任何东西。
      # 失败时直接保存 PE imports 与嵌入 manifest，下一次不再靠猜缺失入口点。
      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path (Get-Location) 'target/ci-loader-diagnostics'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem 'target/debug/deps/agent_pulse_lib-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            'No agent_pulse_lib test executable was produced.' |
              Set-Content (Join-Path $out 'missing-test-exe.txt')
            exit 0
          }

          $exe.FullName | Set-Content (Join-Path $out 'test-exe.txt')

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
          }
          $dumpbin = if ($vs) {
            Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Recurse -Filter dumpbin.exe |
              Where-Object FullName -Match 'Hostx64\\x64\\dumpbin\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($dumpbin) {
            & $dumpbin.FullName /imports $exe.FullName 2>&1 |
              Tee-Object (Join-Path $out 'imports.txt')
            & $dumpbin.FullName /dependents $exe.FullName 2>&1 |
              Tee-Object (Join-Path $out 'dependents.txt')
          } else {
            'dumpbin.exe not found' | Set-Content (Join-Path $out 'dumpbin-not-found.txt')
          }

          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $mt = if (Test-Path $kits) {
            Get-ChildItem $kits -Recurse -Filter mt.exe |
              Where-Object FullName -Match '\\x64\\mt\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($mt) {
            $manifest = Join-Path $out 'test-harness.manifest'
            & $mt.FullName "-inputresource:$($exe.FullName);#1" "-out:$manifest" 2>&1 |
              Tee-Object (Join-Path $out 'mt.txt')
            if (Test-Path $manifest) { Get-Content $manifest }
          } else {
            'mt.exe not found' | Set-Content (Join-Path $out 'mt-not-found.txt')
          }

          Get-ChildItem target -Recurse -Filter '*.dll' |
            Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize | Out-String -Width 4096 |
            Tee-Object (Join-Path $out 'native-dlls.txt')

      - name: Upload Windows loader diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: windows-loader-diagnostics
          path: src-tauri/target/ci-loader-diagnostics
          if-no-files-found: warn

  check-frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 单元测试单独一步：`pnpm build` 只保证「编得过」，不保证 store 的归约
      # 和显示映射没被改坏。测试挂了要能一眼看出是测试挂了，而不是构建挂了。
      - name: Unit tests
        run: pnpm test

      - name: Type check & build
        run: pnpm build

  build-tauri:
    name: Build (${{ matrix.platform }} - ${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-rust, check-frontend]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: agent-pulse-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: agent-pulse-*
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
